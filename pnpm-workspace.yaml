verifyDepsBeforeRun: install
minimumReleaseAge: 1440
packages:
  - "packages/*"
  - "docs/**"
allowBuilds:
  esbuild: true
  sharp: true
packageExtensions:
  "@preact/preset-vite@2.8.2":
    dependencies:
      "@babel/code-frame": ^7.0.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  vitest: 5.1.0
  vite-plus: 0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  esbuild: ^0.28.2
  typescript: ^7.0.2
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^26.6.6
  "@vitest/browser-playwright": 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

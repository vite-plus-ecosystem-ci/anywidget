verifyDepsBeforeRun: install
minimumReleaseAge: 1440
packages:
  - "packages/*"
  - "docs/**"
allowBuilds:
  esbuild: true
  sharp: true
packageExtensions:
  "@preact/preset-vite@2.8.2":
    dependencies:
      "@babel/code-frame": ^7.0.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6b26ec56e76df770e2aa5ad78571d42d20b5383c
  vitest: 5.0.1
  vite-plus: 0.0.0-commit.6b26ec56e76df770e2aa5ad78571d42d20b5383c
  esbuild: ^0.28.1
  typescript: ^7.0.2
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@types/node": ^26.1.2
  "@vitest/browser-playwright": 5.0.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeExclude:
  - "vite-plus"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
